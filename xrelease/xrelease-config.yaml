# taxon to use for incertae sedis names during merges
incertaeSedis:
  id: S
  name: incertae sedis
  rank: unranked
  status: PROVISIONALLY_ACCEPTED

failOnSyncErrors: false
removeEmptyGenera: false

# If true algorithmic detects and synonymizes (sub)species misspellings per family as part of the homotypic grouping.
misspellingConsolidation: true

# Flag exact same, accepted names but with different authors as provisionally accepted.
flagDuplicatesAsProvisional: true

# activate the homotypic grouping?
homotypicConsolidation: true
homotypicConsolidationThreads: 8

# More about decisions 
# https://github.com/CatalogueOfLife/data/issues/816

# A decision subject can have any of these properties, but must at least always have a name:
#   name: Abies alba
#   authorship: Mill.
#   rank: species
#   status: accepted
#   parent: Abies
decisions:
  2317: # 3i Auchenorrhyncha
    - mode: reviewed
      subject:
        name: Cercopoidea
        rank: superfamily
    - mode: reviewed
      subject:
        name: Fulgoromorpha
        rank: infraorder

issueExclusion:
- UNPARSABLE_NAME
- UNPARSABLE_AUTHORSHIP
- NULL_EPITHET
- INDETERMINED
- HIGHER_RANK_BINOMIAL
- MISSING_GENUS
- INCONSISTENT_NAME
- PARTIALLY_PARSABLE_NAME

